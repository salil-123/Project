# Workstation deploy — PULL the deps image, MOUNT the code from the host.
# Update the app with `git pull` + `docker compose ... restart` (no image rebuild).
#
#   1) git clone <repo> && cd it
#   2) cp deploy/.env.example .env    # fill EE_PROJECT, EE_ASSET_ROOT, STAC_ASSET_BASE, EE key path
#   3) docker compose -f docker-compose.hub.yml pull
#   4) docker compose -f docker-compose.hub.yml up -d
#   5) open http://<host>:8000/   |   health: curl http://<host>:8000/api/health
#   later: git pull && docker compose -f docker-compose.hub.yml restart
services:
  lulc:
    image: salil2003/corestack-lulc:1.0.0    # dependencies only; pinned to VERSION so a stray :latest push cant change the tower
    pull_policy: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Three separate bind-mounts (cluster checklist #1). They default to this checkout so a laptop
      # needs no setup, and on the cluster you point them at the host's real dirs in .env:
      #   CORESTACK_CODE_HOST=/srv/corestack-lulc/code
      #   CORESTACK_MODELS_HOST=/srv/corestack-lulc/models
      #   CORESTACK_DATA_HOST=/srv/corestack-lulc/data
      - ${CORESTACK_CODE_HOST:-.}:/app                      # code: `git pull` + restart, no rebuild
      - ${CORESTACK_MODELS_HOST:-./models}:/app/models      # trained weights
      - ${CORESTACK_DATA_HOST:-./data}:/app/data            # inputs, caches, outputs, logs
      # logs called out explicitly (checklist #5 wants ./data/logs/<app> mounted to the log path).
      # Redundant with the data mount above, but it makes the requirement visible at a glance.
      - ${CORESTACK_DATA_HOST:-./data}/logs/corestack-lulc:/app/data/logs/corestack-lulc
      # Earth Engine service-account key (headless auth). Point EE_SERVICE_ACCOUNT_KEY at it in .env.
      # - ./deploy/ee-key.json:/app/ee-key.json:ro
    restart: unless-stopped

  # File Browser over every project's folder: runs, schemes, GeoTIFFs. Read-only mount and no login, so
  # anyone can look and nobody can change a thing. nginx serves it at /act4dws5/diy-lulc/files/ (the
  # baseurl below has to match that path); set FILEBROWSER_URL=files in .env so the app links to it.
  files:
    image: filebrowser/filebrowser:v2.31.2
    ports:
      - "8081:8080"
    volumes:
      - ${CORESTACK_DATA_HOST:-./data}/projects:/srv:ro
    entrypoint: ["/bin/sh", "-c"]
    # the settings db is rebuilt on every start, so a restart always comes back the same way. The image's
    # own /.filebrowser.json would reset the base url, hence -b again on the serve line
    command:
      - >
        B=$${FILEBROWSER_BASEURL:-/act4dws5/diy-lulc/files} && rm -f /tmp/fb.db &&
        /filebrowser -d /tmp/fb.db config init --auth.method=noauth > /dev/null &&
        /filebrowser -d /tmp/fb.db users add corestack corestack --perm.admin=false
        --perm.create=false --perm.delete=false --perm.modify=false --perm.rename=false
        --perm.share=false --perm.execute=false --perm.download=true > /dev/null &&
        exec /filebrowser -d /tmp/fb.db -r /srv -a 0.0.0.0 -p 8080 -b "$$B"
    environment:
      - FILEBROWSER_BASEURL
    healthcheck:                 # the image's own check knocks on port 80 without the base url
      test: ["CMD-SHELL", "curl -fs http://localhost:8080$${FILEBROWSER_BASEURL:-/act4dws5/diy-lulc/files}/health"]
      interval: 30s
    restart: unless-stopped
