events {}
http {
  server {
    listen 8080;
    # the block from deploy/Deployment_guide.md, as on the tower
    location /act4dws5/diy-lulc/ {
      proxy_pass http://lulc:8000/;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;        # the CSE front proxy gives up at 60 s; this mimics it
      client_max_body_size 50m;
    }
  }
}
