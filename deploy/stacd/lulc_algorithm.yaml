# Algorithm instance (algorithm_repo) for our LULC model, matching STACD_framework/dev
# sample_yaml/normal_year_dags/algorithm_repo_normal.yaml. API-mode, like every instance in their
# pipeline: a synchronous endpoint that runs the GEE task and returns the output asset_id.
---
!Algorithm_Instance
type: Custom_LULC
version: "1"
assets:
  code: "https://github.com/salil-123/Project"
date: 2026-08-11 00:00:00
execution_modes:
  api:
    enabled: true
    priority: 1
    # our container endpoint: classifies the region server-side in Earth Engine, exports the raster
    # to a GEE asset, and returns {asset_id, version, hosting_platform: "GEE"} (the export-asset
    # endpoint I still need to add). Swap host/port for however the DAG reaches the container.
    url: "http://lulc:8000/api/export-asset"
