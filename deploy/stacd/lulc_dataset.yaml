# Dataset instance (dataset_repo) matching STACD_framework/dev sample_yaml/.../dataset_repo_normal.yaml.
# In the full CoreStack pipeline the root is Pan_India_MWS and MWS_Boundaries is auto-produced upstream,
# so nothing new needs registering. For a STANDALONE run of just our LULC, register the MWS boundary
# asset our algorithm reads geometry from:
---
!Dataset_Instance
type_id: MWS_Boundaries
version: "1"
region: pan_india
asset_id: "projects/corestack-datasets/assets/datasets/hydrological_boundaries/microwatershed"
metadata:
  source: "CoRE Stack public GEE datasets account (corestack-datasets)"
  description: "Pan-India micro-watershed V2 boundaries — public read-only GEE asset (root input)"
