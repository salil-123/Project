# Local dev / build. Builds the deps image and mounts this checkout's code at /app.
#   docker compose up -d --build      # build deps image + run with code mounted
#   docker compose restart            # after a `git pull` / code edit — no rebuild needed
services:
  lulc:
    image: salil2003/corestack-lulc:latest
    build: .                          # builds the DEPENDENCIES-only image (see Dockerfile)
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Three separate bind-mounts (cluster checklist #1). They default to this checkout so a laptop
      # needs no setup, and on the cluster you point them at the host's real dirs in .env:
      #   CORESTACK_CODE_HOST=/srv/corestack-lulc/code
      #   CORESTACK_MODELS_HOST=/srv/corestack-lulc/models
      #   CORESTACK_DATA_HOST=/srv/corestack-lulc/data
      - ${CORESTACK_CODE_HOST:-.}:/app                      # code: `git pull` + restart, no rebuild
      - ${CORESTACK_MODELS_HOST:-./models}:/app/models      # trained weights
      - ${CORESTACK_DATA_HOST:-./data}:/app/data            # inputs, caches, outputs, logs
      # - ./deploy/ee-key.json:/app/ee-key.json:ro   # EE service-account key (headless auth)
    restart: unless-stopped
