# Local dev / build. Builds the deps image and mounts this checkout's code at /app.
#   docker compose up -d --build      # build deps image + run with code mounted
#   docker compose restart            # after a `git pull` / code edit — no rebuild needed
services:
  lulc:
    image: salil2003/corestack-lulc:latest
    build: .                          # builds the DEPENDENCIES-only image (see Dockerfile)
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app                        # the app code + data, bind-mounted from the host
      # - ./deploy/ee-key.json:/app/ee-key.json:ro   # EE service-account key (headless auth)
    restart: unless-stopped
